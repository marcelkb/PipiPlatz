<!doctype html>
<html lang="de"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#00548f">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PipiPlatz">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" type="image/svg+xml" href="/icon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="manifest" href="/manifest.webmanifest">
<title>PipiPlatz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&display=swap">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
 --blue:#00548f;--blue-deep:#003b66;--yellow:#ffd500;--yellow-ink:#14181d;
 --ink:#14181d;--ink2:#46525d;--ground:#eef0ed;--panel:#fff;--line:#d3d8d4;
 --link:#00548f;--spine:#9db9cf;--ok-bg:#1a7a3c;--ok-fg:#fff;--maybe:#6b4a00;--err:#b3261e;
 --chip-on:#00548f;--chip-on-fg:#fff;--chip-off-fg:#2d3842;--skel:#e1e5e2;
 --sans:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root{
 --blue:#0a3a5f;--blue-deep:#06263f;--ink:#eef1f3;--ink2:#a9b4bd;--ground:#0d1218;--panel:#151c24;--line:#2a343e;
 --link:#7bbcf0;--spine:#3b556b;--ok-bg:#2f9e58;--ok-fg:#06140b;--maybe:#f0c050;--err:#ff8a80;
 --chip-on:#d6e9f8;--chip-on-fg:#06263f;--chip-off-fg:#c5ced6;--skel:#212b35;
}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:var(--sans);font-size:17px;background:var(--ground);color:var(--ink);-webkit-text-size-adjust:100%}
::selection{background:var(--yellow);color:var(--yellow-ink)}
input,select{caret-color:var(--blue);accent-color:var(--blue)}
*{scrollbar-width:thin;scrollbar-color:var(--spine) transparent}
:focus-visible{outline:3px solid var(--link);outline-offset:2px}
.bar :focus-visible{outline-color:var(--yellow)}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}

#app{display:flex;flex-direction:column;height:100%;height:100dvh}

/* shell */
.bar{background:var(--blue);color:#fff;padding:env(safe-area-inset-top) 12px 10px;flex:none}
.top{display:flex;align-items:center;gap:4px;min-height:52px}
.brand{font-size:26px;font-weight:700;letter-spacing:.01em;margin-right:auto}
.tool{width:48px;height:48px;border-radius:8px;display:grid;place-items:center;color:#fff}
.tool[hidden]{display:none}
.tool:hover{background:rgba(255,255,255,.14)}
.tool[aria-pressed=true]{background:#fff;color:var(--blue)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--blue-deep);border-radius:10px;padding:3px;gap:3px}
.seg button{min-height:48px;border-radius:8px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:600;font-size:18px;color:#d8e6f1}
.seg button[aria-pressed=true]{background:#fff;color:var(--blue)}
.seg button:not([aria-pressed=true]):hover{background:rgba(255,255,255,.1)}

/* route form */
#route{display:none;background:var(--panel);border-bottom:1px solid var(--line);padding:12px;flex:none;max-height:52dvh;overflow:auto;position:relative}
#route.show{display:block}
/* grip: tap or swipe up/down to fold the form away and give the map the space */
#routeTog{display:flex;align-items:center;gap:8px;width:100%;min-height:34px;padding:0 0 8px;border:0;background:none;color:var(--ink2);font:inherit;font-weight:700;text-align:left;cursor:pointer;touch-action:pan-y}
#routeTog span{overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#route.collapsed{padding:8px 12px;max-height:none;overflow:visible}
#route.collapsed #routeTog{padding:0}
#route.collapsed #routeTog .i{transform:rotate(180deg)}
#route.collapsed>:not(#routeTog){display:none}
.fld{display:block;margin-bottom:10px}
.fld>span{display:block;font-size:14px;font-weight:600;color:var(--ink2);margin-bottom:3px}
#route input,#route select{width:100%;min-height:48px;border:1.5px solid var(--line);background:var(--ground);border-radius:8px;padding:0 12px}
#route input:focus,#route select:focus{border-color:var(--link)}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#go{width:100%;min-height:52px;border-radius:8px;background:var(--blue);color:#fff;font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;gap:8px}
#go{position:sticky;bottom:0;box-shadow:0 -10px 14px -8px rgba(0,0,0,.45)} /* form scrolls, "Suchen" stays */
#go:hover{background:var(--blue-deep)}
#go[disabled]{opacity:.6;cursor:progress}
@media (prefers-color-scheme:dark){#go{background:#d6e9f8;color:#06263f}#go:hover{background:#fff}}
.pasterow{display:flex;gap:8px}
.pasterow input{flex:1;min-width:0}
#gmlGo{min-height:48px;padding:0 16px;border-radius:8px;border:1.5px solid var(--blue);color:var(--blue);font-weight:700}
#gmlGo[disabled]{opacity:.6;cursor:progress}
@media (prefers-color-scheme:dark){#gmlGo{border-color:#d6e9f8;color:#d6e9f8}}
#alts:empty{display:none}
#alts{display:grid;gap:8px;margin-bottom:10px}
.alt{text-align:left;min-height:56px;padding:8px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--ground);display:flex;flex-direction:column;gap:2px}
.alt b{font-size:16px}
.alt span{font-size:14px;color:var(--ink2)}
.alt[aria-pressed=true]{border-color:var(--blue);box-shadow:inset 0 0 0 1.5px var(--blue)}
@media (prefers-color-scheme:dark){.alt[aria-pressed=true]{border-color:#d6e9f8;box-shadow:inset 0 0 0 1.5px #d6e9f8}}
#route.alts{max-height:64dvh}
#viaInfo:empty{display:none}
#viaInfo{margin:-4px 0 10px;font-size:14px;color:var(--ink2)}
#sugg:empty{display:none}
/* a floating dropdown under the field being typed: overlaying what follows (selects, "Suchen")
   instead of pushing the form down, so it never ends up below the pinned button */
#sugg{position:absolute;left:12px;right:12px;z-index:30;border:1.5px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);box-shadow:0 8px 20px rgba(0,0,0,.25);max-height:52dvh;overflow-y:auto}
#sugg div{padding:13px 12px;min-height:48px;border-bottom:1px solid var(--line);cursor:pointer}
#sugg div:last-child{border-bottom:0}
#sugg div:hover{background:var(--ground)}

/* filters */
#chips{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;flex:none;background:var(--panel);border-bottom:1px solid var(--line)}
.chip{flex:none;min-height:44px;display:flex;align-items:center;gap:6px;padding:0 14px 0 10px;border-radius:8px;border:1.5px solid var(--line);color:var(--chip-off-fg);font-weight:600;white-space:nowrap}
.chip svg.i{width:20px;height:20px}
.chip.all{border-style:dashed;padding:0 14px}
.chip[aria-pressed=true]{background:var(--chip-on);border-color:var(--chip-on);color:var(--chip-on-fg)}

/* map */
#views{flex:1;position:relative;min-height:90px;overflow:hidden}
#map,#gm{position:absolute;inset:0}
#map{touch-action:manipulation;inset:calc(-1*var(--pady,0px)) calc(-1*var(--padx,0px));transform:rotate(var(--rot,0deg));transform-origin:50% 50%;will-change:transform} /* two-finger rotation, see setRot */
#gm{display:none;border:0;width:100%;height:100%}
@media (prefers-color-scheme:dark){.leaflet-tile-pane{filter:brightness(.72) contrast(1.1)}}
.pin{width:36px;height:36px;border-radius:9px;background:var(--blue);color:#fff;border:2px solid #fff;display:grid;place-items:center;box-shadow:0 2px 5px rgba(0,0,0,.35)}
.pin.sel{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow-ink)}
.leaflet-popup-content{font-family:var(--sans);font-size:16px;margin:12px 14px}
.leaflet-popup-content a{color:var(--link);font-weight:600}
/* the map turns, its labels do not: an inner layer is turned back, because a rotation on the
   Leaflet-positioned element itself would swing it around a second centre and displace it.
   The popup turns around its tip, so the pointer stays glued to the stop at any angle. */
.unturn{width:100%;height:100%;rotate:calc(-1*var(--rot,0deg))}
.leaflet-popup-content-wrapper{transform-origin:50% calc(100% + 11.93px);rotate:calc(-1*var(--rot,0deg))}
.leaflet-popup-tip-container{transform-origin:20px 12.93px;rotate:calc(-1*var(--rot,0deg))}
.leaflet-control-container{position:absolute;inset:var(--pady,0px) var(--padx,0px);rotate:calc(-1*var(--rot,0deg));z-index:1000;pointer-events:none} /* stays viewport-sized, so the controls keep their corners; clicks pass through to the map */
.leaflet-control{pointer-events:auto}
.north{width:44px;height:44px;border-radius:50%;background:var(--panel);color:var(--blue);border:1.5px solid var(--line);display:grid;place-items:center;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.north svg{width:22px;height:22px;fill:currentColor}
.north[hidden]{display:none}

/* strip-map list */
#sheet{flex:0 0 46%;display:flex;flex-direction:column;min-height:0;background:var(--panel);border-top:1px solid var(--line)}
#app.routing #sheet{flex-basis:32%}
#app.bigmap #sheet{display:none}
#status{flex:none;padding:10px 14px;font-size:16px;font-weight:600;color:var(--ink2);border-bottom:1px solid var(--line)}
#status.err{color:var(--err)}
#list{flex:1;overflow:auto;padding-bottom:env(safe-area-inset-bottom)}
.poi{display:grid;grid-template-columns:78px 22px 1fr auto;align-items:start;column-gap:6px;padding:10px 12px 10px 8px;min-height:84px;border-bottom:1px solid var(--line);cursor:pointer}
.poi.sel{background:color-mix(in srgb,var(--yellow) 22%,var(--panel))}
.d{text-align:right;padding-top:4px;font-variant-numeric:tabular-nums;line-height:1}
.d b{display:block;font-size:30px;font-weight:700;letter-spacing:-.01em}
.d span{font-size:14px;font-weight:600;color:var(--ink2)}
.sp{position:relative;align-self:stretch;margin:-10px 0}
.sp::before{content:"";position:absolute;left:9px;width:4px;top:0;bottom:0;background:var(--spine)}
.poi:first-child .sp::before{top:25px}
.poi:last-child .sp::before{bottom:auto;height:25px}
.poi:only-child .sp::before{display:none}
.sp i{position:absolute;left:3px;top:19px;width:16px;height:16px;border-radius:50%;background:var(--panel);border:4px solid var(--blue)}
.poi.sel .sp i{background:var(--yellow);border-color:var(--yellow-ink)}
@media (prefers-color-scheme:dark){.sp i{border-color:var(--link)}}
.t{min-width:0;padding-top:2px}
.n{font-size:19px;font-weight:600;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sub{margin-top:1px;font-size:14px;font-weight:500;line-height:1.2;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m{margin-top:3px;font-size:15px;color:var(--ink2)}
.m svg.i{width:17px;height:17px;display:inline-block;vertical-align:-3px;margin-right:4px}
.wc{display:inline-flex;align-items:center;gap:4px;margin-top:6px;padding:2px 8px;border-radius:6px;font-size:14px;font-weight:700}
.wc svg.i{width:15px;height:15px;stroke-width:3}
.wc.ok{background:var(--ok-bg);color:var(--ok-fg)}
.wc.maybe{border:1.5px dashed var(--maybe);color:var(--maybe)}
.go{align-self:center;min-width:76px;min-height:52px;padding:0 14px;border-radius:8px;background:var(--yellow);color:var(--yellow-ink);text-decoration:none;font-weight:700;font-size:19px;display:flex;align-items:center;justify-content:center;gap:6px}
.go:hover{background:#ffe24d}
.empty{padding:20px 16px;color:var(--ink2);line-height:1.35}
.empty b{display:block;color:var(--ink);font-size:19px;margin-bottom:4px}
.opp{display:flex;align-items:center;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line);color:var(--ink2);font-size:14px}
.opp span{flex:1}
.oppTog{padding:5px 11px;border:1.5px solid var(--line);border-radius:7px;color:var(--link);font-weight:700;font-size:14px;background:none}
.oppTag{color:var(--maybe);font-weight:700}
.skel{display:grid;grid-template-columns:78px 22px 1fr 76px;gap:6px;padding:14px 12px 14px 8px;border-bottom:1px solid var(--line)}
.skel i{display:block;height:26px;border-radius:5px;background:var(--skel);animation:pulse 1.2s ease-in-out infinite}
.skel i:nth-child(2){height:16px;width:16px;border-radius:50%;margin-left:3px}
.skel i:nth-child(4){height:48px}
@keyframes pulse{50%{opacity:.45}}
@keyframes spin{to{transform:rotate(360deg)}}
#busy{position:fixed;inset:0;z-index:2000;display:none;align-items:center;justify-content:center;pointer-events:none}
#busy.on{display:flex}
#busy>div{display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 26px;border-radius:12px;background:var(--panel);color:var(--chip-off-fg);font-weight:600;box-shadow:0 6px 28px rgba(0,0,0,.35)}
#busy i{width:44px;height:44px;border-radius:50%;border:5px solid var(--skel);border-top-color:var(--chip-on);animation:spin .8s linear infinite}
#busy .bar{width:200px;height:6px;border-radius:3px;background:var(--skel);overflow:hidden}
#busy .bar b{display:block;height:100%;width:0;background:var(--chip-on);transition:width .4s linear}
#busy small{font-weight:500;font-size:.85em;font-variant-numeric:tabular-nums}
#note{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:2100;display:none;max-width:min(92vw,520px);padding:12px 16px;border-radius:10px;background:var(--yellow);color:var(--yellow-ink);font-weight:700;line-height:1.3;box-shadow:0 6px 24px rgba(0,0,0,.35)}
#note.on{display:block;cursor:pointer} /* a tap dismisses it */
@media (prefers-reduced-motion:reduce){.skel i{animation:none}#busy i{animation-duration:2.4s}}
</style></head><body>

<div id="app">
 <header class="bar">
  <div class="top">
   <div class="brand">PipiPlatz</div>
   <button class="tool" id="share" hidden aria-label="Route teilen"><svg class="i"><use href="#i-share"/></svg></button>
   <button class="tool" id="gmtab"aria-pressed="false" aria-label="Google-Maps-Ansicht"><svg class="i"><use href="#i-map"/></svg></button>
   <button class="tool" id="cfg" aria-label="Einstellungen: Google-API-Key"><svg class="i"><use href="#i-sliders"/></svg></button>
  </div>
  <div class="seg" role="group" aria-label="Suchmodus">
   <button id="loc" aria-pressed="true"><svg class="i"><use href="#i-locate"/></svg>In der Nähe</button>
   <button id="rt" aria-pressed="false"><svg class="i"><use href="#i-route"/></svg>Entlang der Route</button>
  </div>
 </header>
 <div id="route">
  <button id="routeTog" type="button" aria-expanded="true" title="Formular hochschieben"><svg class="i"><use href="#i-chevron"/></svg><span id="routeTogT">Route</span></button>
  <div class="fld"><div class="pasterow"><input id="gml" type="url" inputmode="url" aria-label="Google-Maps-Link" placeholder="Google-Maps-Link der geplanten Route" autocomplete="off"><button id="gmlGo" type="button">Laden</button></div></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const KINDS={rastplatz:['rastplatz','Rastplatz'],wc:['wc','WC'],burger:['burger','Burger'],raststaette:['raststaette','Raststätte'],tank:['tank','Tankstelle'],super:['super','Supermarkt'],moebel:['moebel','Möbelhaus'],bau:['bau','Baumarkt'],mall:['mall','Einkaufszentrum'],bahnhof:['bahnhof','Bahnhof'],other:['other','Restaurant']};
const DEFAULT_ON=Object.keys(KINDS);
const MWY_FACILITY=new Set(['raststaette','rastplatz','wc']); // only these are unusable from the other carriageway
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ico=(n,c='')=>`<svg class="i ${c}" aria-hidden="true"><use href="#i-${n}"/></svg>`;
const map=L.map('map',{zoomControl:false,doubleClickZoom:false}).setView([51.1,10.4],6);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);

// Two-finger rotation, as in Google Maps. The container is turned and padded out to a centred
// square of the viewport's diagonal: at a steep angle the turned viewport needs half its diagonal
// on each axis, and anything less leaves the revealed corners grey. Scaling the container instead
// would keep the view identical, but a scaled raster tile grid rounds differently per tile and
// leaves a visible seam across the map.
const mapBox=$('map');
let rot=0, rot0=0, ang0=0, spinning=false, padded=false;
// (Re)compute the padding for the viewport's size right now. Called when the turn starts and again
// whenever the viewport changes size while turned: the route form folds, the results close it, the
// map goes full height, the phone is turned or Safari's toolbar slides away - with the padding of the
// moment the turn began, the revealed corners stayed grey in all of those.
function layoutPad(){
  const box=mapBox.parentElement; // the viewport the map is seen through
  const diag=padded?Math.hypot(box.clientWidth,box.clientHeight)+4:0; // +4: sub-pixel rounding must not leave a hairline
  if(padded&&diag<5)return false; // no box to measure against
  const c=map.getCenter(), z=map.getZoom();
  mapBox.style.setProperty('--padx',padded?((diag-box.clientWidth)/2).toFixed(1)+'px':'0px');
  mapBox.style.setProperty('--pady',padded?((diag-box.clientHeight)/2).toFixed(1)+'px':'0px');
  map.invalidateSize({pan:false}); // the container changed size: load tiles for the new area
  map.setView(c,z,{animate:false,reset:true}); // invalidateSize shifts the centre; put it back
  if(map._popup)map._popup.update(); // the open popup keeps its place on the re-laid-out map
  return true;
}
function padMap(on){
  if(on===padded)return;
  padded=on;
  if(on&&!layoutPad())padded=false; // retry on the next gesture event
  else if(!on)layoutPad();
}
let padRaf=0;
new ResizeObserver(()=>{if(!padded||padRaf)return;padRaf=requestAnimationFrame(()=>{padRaf=0;if(padded)layoutPad()})}).observe(mapBox.parentElement);
function setRot(deg){
  rot=((deg+180)%360+360)%360-180;
  mapBox.style.setProperty('--rot',rot.toFixed(2)+'deg');
  const nb=$('north'); if(nb)nb.hidden=Math.abs(rot)<0.5;
}
// Leaflet reads a pointer through the container's bounding box, which is the axis-aligned box of a
// turned element. Undo the turn around the centre so taps and drags stay exact.
const mec=map.mouseEventToContainerPoint.bind(map);
map.mouseEventToContainerPoint=e=>{
  if(!rot)return mec(e);
  const r=mapBox.getBoundingClientRect(), w=mapBox.offsetWidth, h=mapBox.offsetHeight;
  const cx=r.left+r.width/2, cy=r.top+r.height/2, a=-rot*Math.PI/180, dx=e.clientX-cx, dy=e.clientY-cy;
  return L.point(w/2+dx*Math.cos(a)-dy*Math.sin(a), h/2+dx*Math.sin(a)+dy*Math.cos(a));
};
// Dragging has the same problem: Leaflet's Draggable moves the map pane by the raw screen delta of
// the pointer, but the pane lives in the turned frame, so on a turned map the content slid off at an
// angle to the finger. Turn the delta back before Leaflet sees it.
// <pan-rotation>
function unturn(dx,dy,deg){
  const a=-deg*Math.PI/180, c=Math.cos(a), s=Math.sin(a);
  return [dx*c-dy*s, dx*s+dy*c];
}
// </pan-rotation>
const dragMove=L.Draggable.prototype._onMove;
L.Draggable.prototype._onMove=function(e){
  if(!rot||(e.touches&&e.touches.length!==1))return dragMove.call(this,e); // pinch: Leaflet ignores it anyway
  const p=e.touches?e.touches[0]:e, s=this._startPoint;
  const [dx,dy]=unturn(p.clientX-s.x,p.clientY-s.y,rot);
  // Leaflet divides the delta by the CSS scale it measures (bounding box / layout size), which for a
  // turned box is bigger than 1 although nothing is scaled: multiply it back in.
  const k=this._parentScale||{x:1,y:1};
  return dragMove.call(this,{clientX:s.x+dx*k.x,clientY:s.y+dy*k.y,preventDefault:()=>e.preventDefault(),
    target:e.target,type:e.type,originalEvent:e});
};
const two=e=>e.touches.length===2?[e.touches[0],e.touches[1]]:null;
const ang=t=>Math.atan2(t[1].clientY-t[0].clientY,t[1].clientX-t[0].clientX)*180/Math.PI;
mapBox.addEventListener('touchstart',e=>{const t=two(e);if(!t)return;spinning=true;ang0=ang(t);rot0=rot},{passive:true});
mapBox.addEventListener('touchmove',e=>{
  if(!spinning)return; const t=two(e); if(!t)return;
  let d=ang(t)-ang0; d=((d+180)%360+360)%360-180;  // shortest way round
  setRot(rot0+d);
  if(Math.abs(rot)>3)padMap(true); // a plain pinch never gets here, so it keeps its size
  e.preventDefault();
},{passive:false});
mapBox.addEventListener('touchend',e=>{
  if(e.touches.length>=2)return;
  spinning=false;
  if(Math.abs(rot)<=0.5){setRot(0);padMap(false)}
},{passive:true});
mapBox.addEventListener('touchcancel',()=>{spinning=false},{passive:true});
const North=L.Control.extend({options:{position:'topright'},onAdd(){
  const b=L.DomUtil.create('button','north'); b.id='north'; b.type='button'; b.hidden=true;
  b.title='Nach Norden'; b.setAttribute('aria-label','Karte nach Norden drehen');
  b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l5 16-5-4-5 4z"/></svg>';
  L.DomEvent.disableClickPropagation(b); L.DomEvent.on(b,'click',()=>{setRot(0);padMap(false)});
  return b;}});
new North().addTo(map);
const layer=L.layerGroup().addTo(map); let routeLine=null, me=null, meMarker=null;
let pois=[], dest=null, routeInfo=null, filt=new Set(DEFAULT_ON), watchId=null, selId=null, showOpp=false;
const markers={};

function setStatus(t,err){const s=$('status');s.textContent=t;s.classList.toggle('err',!!err)}
function setMode(m){$('loc').setAttribute('aria-pressed',m==='near');$('rt').setAttribute('aria-pressed',m==='route');bigMap(false)}

// filter chips
$('chips').innerHTML='<button class="chip all" id="allBtn"></button>'+Object.entries(KINDS).map(([k,[i,n]])=>`<button class="chip" aria-pressed="${filt.has(k)}" data-k="${k}">${ico(i)}${n}</button>`).join('');
const syncChips=()=>{const all=filt.size===Object.keys(KINDS).length;
  document.querySelectorAll('#chips .chip[data-k]').forEach(c=>c.setAttribute('aria-pressed',filt.has(c.dataset.k)));
  $('allBtn').textContent=all?'Alle abwählen':'Alle wählen';};
$('chips').onclick=e=>{const b=e.target.closest('.chip');if(!b)return;
  if(b.id==='allBtn'){filt=filt.size===Object.keys(KINDS).length?new Set():new Set(Object.keys(KINDS));}
  else{const k=b.dataset.k;filt.has(k)?filt.delete(k):filt.add(k);}
  syncChips();render();};
syncChips();

const de=(v)=>v.toLocaleString('de-DE',{minimumFractionDigits:1,maximumFractionDigits:1});
const fmt=m=>m>=1000?de(m/1000)+' km':Math.round(m)+' m';
const fmtP=m=>m>=1000?[de(m/1000),'km']:[String(Math.round(m)),'m'];
const gmNav=p=>{ // navigate to POI; if a route is active, keep the final destination as a stop after it
  const base='https://www.google.com/maps/dir/?api=1&travelmode=driving';
  if(dest&&routeInfo){ // stops from a loaded Google route and the POI, in driving order
    const o=me||(routeInfo.route&&routeInfo.route[0]); // typed start: the route knows where it begins
    const wp=[...(routeInfo.vias||[]),{lat:p.lat,lon:p.lon,a:p.along||0}].sort((x,y)=>x.a-y.a).map(x=>`${x.lat},${x.lon}`).join('%7C');
    return `${base}${o?`&origin=${o[0]},${o[1]}`:''}&destination=${dest.lat},${dest.lon}&waypoints=${wp}`}
  return `${base}&destination=${p.lat},${p.lon}`;
};
const pinIcon=(p,sel)=>L.divIcon({html:`<div class="unturn"><div class="pin${sel?' sel':''}">${ico(KINDS[p.kind][0])}</div></div>`,className:'',iconSize:[36,36],iconAnchor:[18,18]});

// time estimate: median of the last durations per search mode, kept in localStorage
const DEF_EST={nearby:6,route:25};
let busyT=null,busyT0=0,busyMode='nearby';
function estimate(mode){try{const a=JSON.parse(localStorage.getItem('pp-dur2-'+mode)||'[]').sort((x,y)=>x-y);
  if(a.length)return a[Math.floor(a.length/2)]}catch(e){}return DEF_EST[mode]}
function busyRec(){try{const k='pp-dur2-'+busyMode,a=JSON.parse(localStorage.getItem(k)||'[]');
  a.push(Math.max(1,Math.round((Date.now()-busyT0)/1000)));localStorage.setItem(k,JSON.stringify(a.slice(-5)))}catch(e){}}
function busy(on,mode){
  $('busy').classList.toggle('on',on);clearInterval(busyT);
  if(!on)return;
  busyMode=mode||'nearby';busyT0=Date.now();const est=estimate(busyMode);
  const tick=()=>{const el=(Date.now()-busyT0)/1000;
    $('busyBar').style.width=Math.min(95,el/est*100)+'%';
    $('busyEta').textContent=el<est?`ca. ${Math.max(1,Math.ceil(est-el))} s verbleibend`:'gleich fertig…'};
  tick();busyT=setInterval(tick,500)}
function skeleton(){$('list').innerHTML='<div class="skel"><i></i><i></i><i></i><i></i></div>'.repeat(3)}

function render(){
  layer.clearLayers();for(const k in markers)delete markers[k];
  const all=pois.filter(p=>filt.has(p.kind));
  const opp=all.filter(p=>p.opp&&MWY_FACILITY.has(p.kind));   // not reachable without turning around
  const rows=showOpp?all:all.filter(p=>!(p.opp&&MWY_FACILITY.has(p.kind)));
  const banner=opp.length?`<div class="opp"><span>${opp.length} Raststätte/Rastplatz/WC auf der Gegenfahrbahn${showOpp?'':' ausgeblendet'}</span><button class="oppTog" type="button">${showOpp?'ausblenden':'anzeigen'}</button></div>`:'';
  $('list').innerHTML=banner+rows.map(p=>{
    const [v,u]=fmtP(p.along!=null?p.along:p.dist);
    const [icn,kn]=KINDS[p.kind];
    const meta=[`${ico(icn)}${kn}`];
    if(p.along!=null)meta.push(esc(fmt(p.off))+' abseits');
    if(p.opp)meta.push(`<b class="oppTag">${MWY_FACILITY.has(p.kind)?'Gegenfahrbahn':'andere Seite'}</b>`);
    if(p.hours)meta.push(esc(p.hours));
    if(p.fee)meta.push('Gebühr '+esc({yes:'Ja',no:'Nein'}[String(p.fee).toLowerCase()]||p.fee));
    if(p.hint)meta.push(esc(p.hint));
    const wc=p.wc===true?`<span class="wc ok">${ico('check')}WC vorhanden</span>`:p.wc==='likely'?'<span class="wc maybe">WC wahrscheinlich</span>':'<span class="wc maybe">WC unklar</span>';
    return `<div class="poi${p.id===selId?' sel':''}" data-id="${esc(p.id)}" tabindex="0"><div class="d"><b>${v}</b><span>${u}${p.along!=null?' voraus':''}</span></div><div class="sp"><i></i></div><div class="t"><div class="n">${esc(p.name)}</div>${p.sub?`<div class="sub">${esc(p.sub)}</div>`:''}<div class="m">${meta.join(' · ')}</div>${wc}</div><a class="go" target="_blank" rel="noopener" aria-label="Navigation zu ${esc(p.name)}" href="${gmNav(p)}">${ico('go')}Los</a></div>`}).join('')
    ||'<div class="empty"><b>Nichts gefunden</b>Filter oben lockern oder bei der Routensuche den seitlichen Abstand vergrößern.</div>';
  rows.forEach(p=>{const m=L.marker([p.lat,p.lon],{icon:pinIcon(p,p.id===selId)}).bindPopup(`<b>${esc(p.name)}</b>${p.sub?`<br><small>${esc(p.sub)}</small>`:''}<br><a target="_blank" rel="noopener" href="${gmNav(p)}">In Google Maps navigieren</a>`).addTo(layer);
    m.on('click',()=>select(p.id,true));markers[p.id]=m;});
  updateGm();
}
function select(id,scroll){
  const old=selId;selId=id;
  for(const k of [old,id]){const p=pois.find(x=>x.id===k);if(p&&markers[k])markers[k].setIcon(pinIcon(p,k===selId));}
  document.querySelectorAll('.poi').forEach(el=>el.classList.toggle('sel',el.dataset.id===id));
  if(scroll){const el=document.querySelector(`.poi[data-id="${CSS.escape(id)}"]`);if(el)el.scrollIntoView({block:'nearest'})}
}
function pick(el){const p=pois.find(x=>x.id===el.dataset.id);if(!p)return;select(p.id,false);map.setView([p.lat,p.lon],16);}
$('list').onclick=e=>{if(e.target.closest('.oppTog')){showOpp=!showOpp;render();return}
  const el=e.target.closest('.poi');if(!el||e.target.closest('a'))return;pick(el)};
$('list').onkeydown=e=>{if(e.key!=='Enter'||e.target.closest('a'))return;const el=e.target.closest('.poi');if(el)pick(el)};

// fetch + JSON. A dropped connection (Safari: "TypeError: Load failed", Chrome: "Failed to fetch") or a
// 5xx page from a sleeping server is retried twice, then it ends as a readable message, never a raw TypeError.
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const RETRY_WAIT=[1500,4000];
async function api(url,opt){
  for(let k=0;;k++){
    let res;
    try{res=await fetch(url,opt)}
    catch(e){if(k<RETRY_WAIT.length){await sleep(RETRY_WAIT[k]);continue}throw 'Verbindung zum Server unterbrochen – bitte nochmal versuchen'}
    const r=await res.json().catch(()=>null);
    if(r!==null)return r;
    if(res.status>=500&&k<RETRY_WAIT.length){await sleep(RETRY_WAIT[k]);continue}
    throw `Server antwortet nicht wie erwartet (HTTP ${res.status}) – bitte nochmal versuchen`}
}
const postJson=(url,body)=>api(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});

async function nearby(){
  alongSeq++;clearTimeout(pollT);note('');
  setStatus('Suche in der Nähe…');skeleton();busy(true,'nearby');
  lastRoute=null;$('share').hidden=true; // the list is no longer the route that was shared
  try{const r=await api(`/api/nearby?lat=${me[0]}&lon=${me[1]}`);
    if(r.error)throw r.error;
    pois=r.pois;routeInfo=null;selId=null;if(routeLine){map.removeLayer(routeLine);routeLine=null}
    setStatus(`${pois.length} Orte im Umkreis von ${r.radius/1000} km${r.partial?' (teilweise, Server überlastet)':''}`);render();busyRec();
  }catch(e){setStatus('Fehler: '+e,true);$('list').innerHTML=''}
  finally{busy(false)}
}
function setMe(pos,first){
  const old=me;me=[pos.coords.latitude,pos.coords.longitude];
  if(!meMarker)meMarker=L.circleMarker(me,{radius:9,color:'#fff',weight:3,fillColor:'#00548f',fillOpacity:1}).addTo(map);else meMarker.setLatLng(me);
  // search on a fresh fix only when there is no position yet or it really moved (no double search on a cached fix)
  if(first&&(!old||Math.abs(old[0]-me[0])>0.002||Math.abs(old[1]-me[1])>0.002)){map.setView(me,13);nearby();}
}
const isIos=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>!!navigator.standalone||matchMedia('(display-mode: standalone)').matches;
function deniedHint(){
  if(!isIos)return 'Standort-Zugriff verweigert. In den Browser-Einstellungen für diese Seite erlauben (HTTPS nötig).';
  return 'Standort verweigert – iOS fragt nicht noch einmal, wenn einmal „Nicht erlauben“ gewählt wurde.\n'
    +(isStandalone()
      ?'Einstellungen ▸ Datenschutz & Sicherheit ▸ Ortungsdienste ▸ PipiPlatz ▸ Beim Verwenden der App'
      :'Einstellungen ▸ Safari ▸ Standort ▸ Fragen / Beim Verwenden der App')
    +'\nRoutensuche geht auch mit getipptem Start.';
}
// why geolocation cannot even be asked, or ''. Safari/iOS asks only on a secure origin; over http:// it denies at once without any dialog
function geoGate(){
  if(!navigator.geolocation)return 'Keine Geolocation (HTTPS nötig!)';
  if(!window.isSecureContext)return 'Standort braucht HTTPS: diese Seite läuft über http://, iOS fragt dann nicht, sondern verweigert sofort.\nÜber https öffnen (z. B. cloudflared-Tunnel) und von dort installieren.';
  return '';
}
const geoMsg=e=>e.code===1?deniedHint()
  :e.code===3?'Kein Standort gefunden (Zeitüberschreitung). Kein GPS-Empfang? Nochmal auf „In der Nähe“ tippen.'
  :'Standort nicht verfügbar: '+(e.message||e);
// an empty "Start" means "where I am": the known position, else ask for one now (coarse fix first, GPS as fallback)
function currentFix(){
  if(me)return Promise.resolve(me);
  const bad=geoGate();if(bad)return Promise.reject({code:0,message:bad});
  const g=navigator.geolocation;
  return new Promise((res,rej)=>{
    const ok=p=>{setMe(p,false);res(me)};
    g.getCurrentPosition(ok,e=>{
      if(e.code===1)return rej(e);
      setStatus('GPS-Signal wird gesucht…');
      g.getCurrentPosition(ok,rej,{enableHighAccuracy:true,timeout:30000});
    },{enableHighAccuracy:false,timeout:8000,maximumAge:120000});
  });
}
function locate(){
  const bad=geoGate();if(bad){setStatus(bad,true);return}
  const g=navigator.geolocation;
  const ok=p=>{setMe(p,true);if(watchId==null)watchId=g.watchPosition(q=>setMe(q,false),()=>{},{enableHighAccuracy:true,maximumAge:10000})};
  const fail=e=>{if(me){setStatus('Standort nicht aktualisiert – Ergebnisse für den letzten Standort');return}
    setStatus(geoMsg(e),true)};
  // fast coarse fix first (wifi/cell, may be a bit old); GPS only if that fails, with a longer limit
  g.getCurrentPosition(ok,e=>{
    if(e.code===1)return fail(e);
    setStatus('GPS-Signal wird gesucht…');
    g.getCurrentPosition(ok,fail,{enableHighAccuracy:true,timeout:30000});
  },{enableHighAccuracy:false,timeout:8000,maximumAge:120000});
}
function routePanel(show){$('route').classList.toggle('show',show);$('app').classList.toggle('routing',show);bigMap(false);if(show)routeFold(false);routeTogLabel();map.invalidateSize()}
// fold the route form away: tap the grip or swipe it up (down again to open)
const routeEl=$('route'),routeTog=$('routeTog');
function routeFold(up){
  routeEl.classList.toggle('collapsed',up);
  routeTog.setAttribute('aria-expanded',String(!up));
  routeTog.title=up?'Formular aufklappen':'Formular hochschieben';
  map.invalidateSize();
}
function routeTogLabel(){const t=dest&&dest.name?'Route: '+dest.name:'Route';if($('routeTogT').textContent!==t)$('routeTogT').textContent=t}
let rTogY=null,rTogAt=0;
routeTog.onclick=()=>{if(Date.now()-rTogAt<400)return;routeFold(!routeEl.classList.contains('collapsed'))};
routeTog.addEventListener('touchstart',e=>{rTogY=e.touches[0].clientY},{passive:true});
routeTog.addEventListener('touchend',e=>{
  if(rTogY==null)return;
  const dy=e.changedTouches[0].clientY-rTogY;rTogY=null;
  if(Math.abs(dy)<25)return; // a tap, handled by onclick
  rTogAt=Date.now();routeFold(dy<0);
},{passive:true});
// double click / double tap on the map: full-height map, sheet hidden (again: back)
function bigMap(on){$('app').classList.toggle('bigmap',on);map.invalidateSize()}
let bigAt={touch:0,mouse:0};
function toggleBig(src){
  const n=Date.now(),other=src==='touch'?'mouse':'touch';
  if(n-bigAt[other]<450)return; // the same gesture already counted on the other channel
  bigAt[src]=n;bigMap(!$('app').classList.contains('bigmap'));
}
map.on('dblclick',()=>toggleBig('mouse'));
// iOS Safari does not deliver dblclick for a double tap on the map, so the touches are counted here
let tapT=0,tapX=0,tapY=0,tapMoved=false;
const mapEl=$('map');
mapEl.addEventListener('touchstart',e=>{
  if(e.touches.length!==1){tapT=0;return} // pinch, not a tap
  const t=e.touches[0],n=Date.now();
  if(n-tapT<350&&Math.abs(t.clientX-tapX)<40&&Math.abs(t.clientY-tapY)<40){tapT=0;toggleBig('touch');return} // pair used up
  tapT=n;tapX=t.clientX;tapY=t.clientY;
},{passive:true});
mapEl.addEventListener('touchmove',()=>{tapMoved=true},{passive:true});
mapEl.addEventListener('touchend',()=>{if(tapMoved){tapT=0;tapMoved=false}},{passive:true}); // a drag is no tap

$('loc').onclick=()=>{setMode('near');routePanel(false);if(me)nearby();locate()};
$('rt').onclick=()=>{setMode('route');routePanel(!$('route').classList.contains('show'))};

// destination autocomplete
let startPt=null, via=[]; // via: stops between start and destination, from a Google Maps link
function showVia(){$('viaInfo').textContent=via.length?'Route über: '+via.map(v=>v.name).join(' → '):''}
function clearVia(){if(via.length){via=[];showVia()}}
$('gmlGo').onclick=async()=>{
  const url=$('gml').value.trim();if(!url)return setStatus('Erst einen Google-Maps-Link einfügen',true);
  $('gmlGo').disabled=true;setStatus('Link wird gelesen…');
  try{const r=await postJson('/api/gmaps',{url});
   if(r.error)throw r.error;
   const p=r.points;clearAlts();startPt=p[0];dest=p[p.length-1];via=p.slice(1,-1);
   $('start').value=startPt.name;$('dest').value=dest.name;$('sugg').innerHTML='';showVia();routeTogLabel();
   setStatus(`Route geladen (${p.length} Punkte). Mit „Suchen“ starten.`);
  }catch(e){setStatus('Fehler: '+e,true)}
  finally{$('gmlGo').disabled=false}
};
// route options (OSRM alternatives): the user picks one before the search along it
let alts=null, altSel=0, altKey='';
const altLayer=L.layerGroup().addTo(map);
const dur=s=>{const m=Math.round(s/60);return m>=60?`${Math.floor(m/60)} h ${String(m%60).padStart(2,'0')} min`:m+' min'};
function clearAlts(){alts=null;altKey='';$('alts').innerHTML='';altLayer.clearLayers();$('route').classList.remove('alts');$('goT').textContent='Suchen'}
function drawAlts(){
  altLayer.clearLayers();
  [false,true].forEach(sel=>alts.forEach((a,i)=>{if((i===altSel)!==sel)return;
    const pl=L.polyline(a.route,sel?{color:'#003b66',weight:9,opacity:.95}:{color:'#6b7a89',weight:6,opacity:.75}).addTo(altLayer);
    pl.on('click',()=>pickAlt(i));
    if(sel)L.polyline(a.route,{color:'#ffd500',weight:4,interactive:false}).addTo(altLayer)}));
  $('alts').innerHTML=alts.map((a,i)=>{const d=Math.round((a.duration-alts[0].duration)/60);
    return `<button type="button" class="alt" aria-pressed="${i===altSel}" data-i="${i}"><b>${a.roads.length?'über '+a.roads.map(esc).join(' · '):'Route '+(i+1)}</b><span>${fmt(a.total)} · ${dur(a.duration)}${i?` · ${d>=0?'+':'−'}${Math.abs(d)} min`:' · schnellste'}</span></button>`}).join('')}
function pickAlt(i){altSel=i;drawAlts()}
$('alts').onclick=e=>{const b=e.target.closest('.alt');if(b)pickAlt(+b.dataset.i)};
async function loadRoutes(org,key){ // true when there is a choice to show
  setStatus('Routen werden berechnet…');
  const r=await postJson('/api/routes',{from:org,to:[dest.lat,dest.lon],via:via.map(v=>[v.lat,v.lon])});if(r.error)throw r.error;
  alts=r.routes;altKey=key;altSel=0;
  if(alts.length<2)return false;
  drawAlts();$('route').classList.add('alts');$('goT').textContent='Entlang dieser Route suchen';
  setStatus(`${alts.length} Routen gefunden. Route wählen, dann suchen.`);map.invalidateSize();map.fitBounds(altLayer.getLayers()[0].getBounds());
  return true}
let suggSeq=0; // both fields share #sugg: only the answer to the latest keystroke may fill it
function suggest(inp,set){let tm;inp.oninput=()=>{clearTimeout(tm);const mine=++suggSeq,q=inp.value;clearVia();clearAlts();if(inp.id==='start')startPt=null;else{dest=null;routeTogLabel()}if(q.length<3){$('sugg').innerHTML='';return}
 const fld=inp.closest('label'), rt=$('route'); // the dropdown floats under the field being typed
 $('sugg').style.top=Math.round(fld.getBoundingClientRect().bottom-rt.getBoundingClientRect().top+rt.scrollTop-4)+'px';
 tm=setTimeout(async()=>{
  let r;try{r=await api('/api/geocode?q='+encodeURIComponent(q))}catch(e){r=null} // a suggestion is optional: no message
  if(mine!==suggSeq)return; // typed on, or moved to the other field, while this was on its way
  if(!Array.isArray(r)){$('sugg').innerHTML='';return} // {error} from the geocoder
  $('sugg').innerHTML=r.map((x,i)=>`<div data-i="${i}">${esc(x.name)}</div>`).join('');
  if(r.length)rt.scrollTop=Math.max(rt.scrollTop,fld.offsetTop-12); // room for the dropdown below the field
  $('sugg').onclick=e=>{const x=r[e.target.dataset.i];if(!x)return;set(x);inp.value=x.name;$('sugg').innerHTML='';routeTogLabel()};},400)}}
suggest($('start'),x=>startPt=x);suggest($('dest'),x=>dest=x);

const routeKey=org=>JSON.stringify([org,dest.lat,dest.lon,via.map(v=>[v.lat,v.lon])]);

// Share link: the planned route as a #fragment, so nothing is stored on the server and the
// fragment never reaches it. The start is the resolved position (as in Google's links), so an
// empty "Start" shares where the sender was. Whatever comes back out is untrusted input.
// <share-codec>
const SHARE_RAD=[1000,2000,4000,8000],SHARE_AHEAD=[50,150,300],SHARE_VIA_MAX=25;
const r5=n=>(+n).toFixed(5);
function encodeShare(r){ // r: {org:[lat,lon], on, dest:{lat,lon,name}, via:[{lat,lon,name}], alt, rad, ahead}
  const p=new URLSearchParams();
  p.set('s',r5(r.org[0])+','+r5(r.org[1]));if(r.on)p.set('sn',r.on.slice(0,120));
  r.via.forEach(v=>{p.append('v',r5(v.lat)+','+r5(v.lon));p.append('vn',(v.name||'').slice(0,120))});
  p.set('d',r5(r.dest.lat)+','+r5(r.dest.lon));p.set('dn',(r.dest.name||'').slice(0,120));
  p.set('alt',r.alt);p.set('rad',r.rad);p.set('ahead',r.ahead);
  return p.toString()}
function sharePt(s){const m=/^(-?\d{1,3}(?:\.\d+)?),(-?\d{1,3}(?:\.\d+)?)$/.exec(s||'');if(!m)return null;
  const a=+m[1],b=+m[2];return Math.abs(a)<=90&&Math.abs(b)<=180?[a,b]:null}
function decodeShare(hash){ // the route, or null when the fragment is not a usable shared route
  const p=new URLSearchParams(String(hash||'').replace(/^#/,''));
  const org=sharePt(p.get('s')),d=sharePt(p.get('d'));if(!org||!d)return null;
  const vp=p.getAll('v').map(sharePt);if(vp.length>SHARE_VIA_MAX||vp.includes(null))return null;
  const vn=p.getAll('vn'),nm=s=>String(s||'').slice(0,120);
  const pick=(list,x,def)=>list.includes(+x)?+x:def;
  return {org,on:nm(p.get('sn')),dest:{lat:d[0],lon:d[1],name:nm(p.get('dn'))},
    via:vp.map((v,i)=>({lat:v[0],lon:v[1],name:nm(vn[i])})),
    alt:Math.max(0,Math.min(9,parseInt(p.get('alt'),10)||0)),
    rad:pick(SHARE_RAD,p.get('rad'),2000),ahead:pick(SHARE_AHEAD,p.get('ahead'),150)}}
// </share-codec>

let lastRoute=null; // what the last successful route search used: the share button sends this, not the form
$('share').onclick=async()=>{
  if(!lastRoute)return;
  const url=location.origin+location.pathname+'#'+encodeShare(lastRoute);
  try{if(navigator.share){await navigator.share({title:'PipiPlatz: Route nach '+(lastRoute.dest.name||'Ziel'),url});return}}
  catch(e){if(e&&e.name==='AbortError')return} // the person closed the share sheet
  try{await navigator.clipboard.writeText(url);note('Link kopiert',3000)}
  catch(e){prompt('Link zur Route:',url)}
};
// open a shared route: fill the form, pick the shared alternative, then search as the Suchen button would
async function openShared(s){
  startPt={lat:s.org[0],lon:s.org[1],name:s.on||'Start der geteilten Route'};
  dest={...s.dest,name:s.dest.name||'Ziel der geteilten Route'};via=s.via;
  $('start').value=startPt.name;$('dest').value=dest.name;$('rad').value=s.rad;$('ahead').value=s.ahead;
  showVia();routeTogLabel();setMode('route');clearAlts();
  setStatus('Geteilte Route wird geladen…');
  try{await loadRoutes(s.org,routeKey(s.org));
    if(alts&&alts.length>1){altSel=Math.min(s.alt,alts.length-1);drawAlts()}
  }catch(e){return setStatus('Fehler: '+e,true)}
  $('go').click()}

let alongSeq=0,pollT=null,noteT=null;
function note(t,ms){$('note').textContent=t||'';$('note').classList.toggle('on',!!t);clearTimeout(noteT);
  if(t&&ms)noteT=setTimeout(()=>$('note').classList.remove('on'),ms)}
$('note').onclick=()=>note(''); // a tap clears the bubble; the search itself keeps running in the background
async function alongSearch(body,seq,first){
  const r=await postJson('/api/along',body);if(r.error)throw r.error;
  if(seq!==alongSeq)return null; // a newer search has started
  pois=r.pois;routeInfo=r;r.vias=via.map((v,i)=>({lat:v.lat,lon:v.lon,a:r.via_along[i]}));
  if(first){selId=null;routePanel(false)}
  if(routeLine)map.removeLayer(routeLine);
  routeLine=L.featureGroup([L.polyline(r.route,{color:'#003b66',weight:10,opacity:.9}),L.polyline(r.route,{color:'#ffd500',weight:5})]).addTo(map);
  if(first)map.fitBounds(routeLine.getBounds());
  const n=pois.length?`${pois.length} Stopps entlang der Strecke`:r.pending?'erste Stopps werden noch gesucht':'keine Stopps gefunden';
  setStatus(`Route ${fmt(r.total)}, ${dur(r.duration)} · ${n}${r.pending?' (Rest lädt)':''}`);
  render();
  if(first)busyRec();
  return r;
}
const POLL_WAIT=[4000,10000,20000,35000,60000,90000]; // the rest is fetched from the cache while it fills
let pollJob=null; // the poll that is waiting for its timer
function alongPoll(body,seq,i,wait){
  clearTimeout(pollT);
  if(i>=POLL_WAIT.length){pollJob=null;return note('Restliche Stopps nicht erhalten (Server überlastet)',8000)}
  pollJob={body,seq,i};
  pollT=setTimeout(()=>pollRun(body,seq,i),wait===undefined?POLL_WAIT[i]:wait);
}
async function pollRun(body,seq,i){
  pollJob=null;
  let r;
  try{r=await alongSearch(body,seq,false)}
  catch(e){ // a failed poll keeps the stops already shown and just tries again later
    if(seq!==alongSeq)return;
    note('Verbindung unterbrochen – neuer Versuch folgt…',4000);
    return alongPoll(body,seq,i+1)}
  if(seq!==alongSeq||!r)return;
  if(r.pending)alongPoll(body,seq,i+1);
  else note(r.partial?'Stopps geladen, einige Bereiche fehlen (Server überlastet)':`Alle ${pois.length} Stopps geladen`,6000);
}
// iOS freezes timers and fetches while the page is in the background: poll at once when it comes back
document.addEventListener('visibilitychange',()=>{
  if(document.hidden||!pollJob||pollJob.seq!==alongSeq)return;
  const j=pollJob;alongPoll(j.body,j.seq,j.i,0)});
$('go').onclick=async()=>{
  if($('start').value&&!startPt)return setStatus('Start aus der Vorschlagsliste wählen',true);
  if(!dest)return setStatus('Ziel aus der Vorschlagsliste wählen',true);
  bigMap(false); // the results live in the sheet
  $('go').disabled=true;
  try{
   let org=startPt?[startPt.lat,startPt.lon]:null;
   if(!org){ // empty Start = my position
     setStatus('Standort wird ermittelt…');
     try{org=await currentFix()}catch(e){return setStatus(geoMsg(e)+'\nOder einen Start eingeben.',true)}
   }
   const key=routeKey(org);
   if(!alts||altKey!==key){if(await loadRoutes(org,key))return}
   const seq=++alongSeq;clearTimeout(pollT);note('');
   setStatus('Suche entlang der Strecke…');skeleton();busy(true,'route');altLayer.clearLayers();
   const body={from:org,to:[dest.lat,dest.lon],via:via.map(v=>[v.lat,v.lon]),alt:altSel,radius:+$('rad').value,ahead_km:+$('ahead').value};
   const r=await alongSearch(body,seq,true);
   if(r){lastRoute={org,on:startPt?startPt.name:'',dest,via:via.slice(),alt:altSel,rad:body.radius,ahead:body.ahead_km};$('share').hidden=false}
   if(r&&r.pending){note('Weitere Stopps werden im Hintergrund geladen…');alongPoll(body,seq,0)}
  }catch(e){setStatus('Fehler: '+e,true);$('list').innerHTML=''}
  finally{$('go').disabled=false;busy(false)}
};

// Google Maps embed (needs free Maps Embed API key, optional)
function updateGm(){
  const key=localStorage.gmkey;if(!key||!me||!dest)return;
  const first=pois.filter(p=>filt.has(p.kind)&&p.along!=null)[0];
  let u=`https://www.google.com/maps/embed/v1/directions?key=${key}&origin=${me[0]},${me[1]}&destination=${dest.lat},${dest.lon}`;
  if(first)u+=`&waypoints=${first.lat},${first.lon}`;
  $('gm').src=u;
}
let gmOn=false;
$('gmtab').onclick=()=>{
  if(!localStorage.gmkey){const k=prompt('Google Maps Embed API Key (kostenlos, optional). Ohne Key bleibt die OSM-Karte.');if(k)localStorage.gmkey=k.trim();else return}
  gmOn=!gmOn;$('gm').style.display=gmOn?'block':'none';$('gmtab').setAttribute('aria-pressed',gmOn);updateGm();
};
$('cfg').onclick=()=>{const k=prompt('Google Embed API Key (leer = löschen)',localStorage.gmkey||'');if(k===null)return;k?localStorage.gmkey=k.trim():localStorage.removeItem('gmkey')};

if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js');
// a shared route skips the startup locate(): its first fix would run nearby(), which cancels the route search
const shared=decodeShare(location.hash);
if(shared){history.replaceState(null,'',location.pathname+location.search);openShared(shared)}
else{skeleton();locate()}
</script></body></html>
